version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jztravel_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: jztravel_backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      SETUP_TOKEN: ${SETUP_TOKEN}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    ports:
      - "${APP_BIND:-0.0.0.0}:${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # HTTPS delante del backend. Lo activa install.sh (COMPOSE_PROFILES=https en el .env) y escribe
  # caddy/Caddyfile: con dominio saca el certificado solo; sin dominio usa la IP del servidor con la CA local
  # de Caddy. Sin HTTPS la sesion no se guarda desde otra PC y el GPS del chofer no funciona.
  caddy:
    image: caddy:2-alpine
    container_name: jztravel_caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0}:${CADDY_HTTP_PORT-80}:80"
      - "0.0.0.0:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
