services:
  db:
    image: postgres:15-alpine
    container_name: jztravel_db
    # Hora local en la base (NOW() de rutas, cotizaciones y fletes): por defecto Argentina; TZ en el .env la cambia.
    command: ["postgres", "-c", "timezone=${TZ:-America/Argentina/Buenos_Aires}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jztravel_backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      SETUP_TOKEN: ${SETUP_TOKEN}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}
    # El HTTPS lo pone el proxy del servidor, que llega a la app por APP_BIND:PORT (install.sh: 0.0.0.0:8010).
    ports:
      - "${APP_BIND:-0.0.0.0}:${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
