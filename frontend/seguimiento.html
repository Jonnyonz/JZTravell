<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Seguimiento de envío</title>
    <style>
        :root { --bg: #f4f6f9; --card: #ffffff; --texto: #212529; --suave: #666; --borde: #e0e0e0; --acento: #2962ff; --ok: #00a844; --mal: #d50000; --pend: #b8860b; }
        @media (prefers-color-scheme: dark) { :root { --bg: #121212; --card: #1e1e1e; --texto: #e0e0e0; --suave: #aaa; --borde: #333; --acento: #4477ff; } }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--texto); }
        .barra { height: 4px; background: var(--acento); }
        main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
        h1 { font-size: 1.3rem; margin: 0 0 4px; }
        .suave { color: var(--suave); font-size: 0.9rem; }
        .card { background: var(--card); border: 1px solid var(--borde); border-radius: 12px; padding: 20px; margin-top: 16px; }
        .estado { font-size: 1.15rem; font-weight: 700; }
        .pasos { display: flex; gap: 6px; margin-top: 12px; }
        .paso { flex: 1; height: 6px; border-radius: 3px; background: var(--borde); }
        .paso.hecho { background: var(--acento); }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 12px 0; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; gap: 12px; }
        li:last-child { border-bottom: none; }
        .badge { font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
        .ok { color: var(--ok); } .mal { color: var(--mal); } .pend { color: var(--pend); }
        a { color: var(--acento); }
        footer { text-align: center; font-size: 0.8rem; color: var(--suave); margin-top: 24px; }
    </style>
</head>
<body>
    <div class="barra"></div>
    <main id="contenido"><p class="suave">Cargando...</p></main>
    <footer>Powered by JZ Tech Solutions</footer>
    <script>
        function esc(v) { return v == null ? '' : String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
        const ESTADOS = { pendiente: ['Programado', 1], camino: ['En camino', 2], completado: ['Entregado', 3], problema: ['Con una incidencia: lo estamos reprogramando', 2] };
        function hora(iso) { return iso ? new Date(iso).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short', hour12: false }) : ''; }
        async function cargar() {
            const caja = document.getElementById('contenido');
            const token = new URLSearchParams(location.search).get('t') || '';
            let d;
            try {
                const r = await fetch('/api/seguimiento/' + encodeURIComponent(token));
                if (!r.ok) throw new Error();
                d = await r.json();
            } catch (e) { caja.innerHTML = '<h1>Envío no encontrado</h1><p class="suave">Revise el link que le enviaron.</p>'; return; }
            const [texto, paso] = ESTADOS[d.estado] || [d.estado, 1];
            const paradas = d.paradas.map(p => {
                const est = p.estado === 'entregada' ? `<span class="badge ok">Entregado ${hora(p.registrado_en)}</span>`
                          : p.estado === 'no_entregada' ? `<span class="badge mal">No se pudo entregar</span>`
                          : `<span class="badge pend">Pendiente</span>`;
                const ventana = (p.ventana[0] || p.ventana[1]) ? `<div class="suave">Horario: ${p.ventana[0] ? 'desde ' + p.ventana[0] : ''} ${p.ventana[1] ? 'hasta ' + p.ventana[1] : ''}</div>` : '';
                return `<li><div><strong>${esc(p.destino)}</strong>${p.ciudad ? `<div class="suave">${esc(p.ciudad)}</div>` : ''}${ventana}</div>${est}</li>`;
            }).join('');
            const pos = d.posicion ? `<p class="suave">Ubicación aproximada del vehículo (actualizada ${hora(d.posicion.actualizada)}): <a href="https://www.google.com/maps?q=${d.posicion.lat},${d.posicion.lon}" target="_blank" rel="noopener">ver en el mapa</a></p>` : '';
            caja.innerHTML = `<h1>${esc(d.empresa || 'Seguimiento de envío')}</h1><div class="suave">Envío N° ${String(d.numero).padStart(6, '0')} · creado ${hora(d.creado_en)}</div>
                <div class="card"><div class="estado">${esc(texto)}</div>
                    <div class="pasos">${[1, 2, 3].map(n => `<div class="paso ${n <= paso ? 'hecho' : ''}"></div>`).join('')}</div>
                    ${d.chofer && d.estado === 'camino' ? `<p class="suave">Lo lleva ${esc(d.chofer)}.</p>` : ''}${pos}</div>
                <div class="card"><ul>${paradas}</ul></div>`;
        }
        cargar();
        setInterval(cargar, 60000);
    </script>
</body>
</html>
